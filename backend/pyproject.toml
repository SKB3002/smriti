[project]
name = "second-brain-backend"
version = "0.1.0"
description = "Second Brain MVP — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "supabase>=2.7",
    "groq>=0.11",
    "pywebpush>=2.0",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "cryptography>=43.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.6",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
